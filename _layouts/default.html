<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {% include head.html %}

  <body>

    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    {% include script.html %}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
      <script src="{{ js_file | relative_url }}" type="text/javascript"></script>
      {% endfor %}
    {% endif %}

  </body>

</html>
