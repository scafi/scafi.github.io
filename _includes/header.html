<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="container{% if page.wide %} wide{% endif %}">
    <a class="brand" href="{{ '/' | relative_url }}">
      <picture>
        <source srcset="{{ '/imgs/scafi-wordmark-dark.svg' | relative_url }}" media="(prefers-color-scheme: dark)">
        <img src="{{ '/imgs/scafi-wordmark.svg' | relative_url }}" alt="ScaFi" width="84" height="30">
      </picture>
    </a>
    <nav aria-label="Main">
      <ul>
        {% assign sorted_pages = site.pages | sort: "order" %}
        {% for my_page in sorted_pages %}
        {% if my_page.title %}
        <li><a href="{{ my_page.static_url | default: my_page.url | relative_url }}"{% if page.url == my_page.url %} aria-current="page"{% endif %}>{{ my_page.title }}</a></li>
        {% endif %}
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
